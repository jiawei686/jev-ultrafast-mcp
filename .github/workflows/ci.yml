name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q

      - name: Locate Chrome
        run: |
          for p in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$p" >/dev/null 2>&1; then echo "JEVMCP_CHROME=$(command -v $p)" >> "$GITHUB_ENV"; break; fi
          done
          echo "using JEVMCP_CHROME=${JEVMCP_CHROME:-<auto>}"

      - name: End-to-end smoke (real browser)
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          python -u scripts/smoke.py 2>&1 | tee smoke.log

      - name: MCP stdio protocol check
        id: mcpcheck
        continue-on-error: true
        run: |
          set -o pipefail
          python -u scripts/mcp_check.py 2>&1 | tee mcp.log

      # Downloading job logs needs repo admin rights; annotations and the step
      # summary do not. So a failing run here is diagnosable from an API call.
      - name: Publish failure detail
        if: steps.smoke.outcome != 'success' || steps.mcpcheck.outcome != 'success'
        run: |
          for f in smoke.log mcp.log; do
            [ -f "$f" ] || continue
            {
              echo "### $f"
              echo '```'
              tail -c 5000 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          grep -h -F '[FAIL]' smoke.log mcp.log 2>/dev/null | head -25 | while IFS= read -r line; do
            echo "::error title=failing check::$(printf '%s' "$line" | sed 's/^ *//' | cut -c1-700)"
          done
          if grep -q -F 'Traceback' smoke.log mcp.log 2>/dev/null; then
            echo "::error title=script crashed::$(grep -h -A8 -F 'Traceback' smoke.log mcp.log | tr '\n' '|' | cut -c1-900)"
          fi
          exit 1
