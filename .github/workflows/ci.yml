name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The Chrome extension is a port of the renderer, and its parity test runs in Node. Without
      # this the pytest case skips and the port could drift unnoticed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The installer writes into files it does not own, so at least prove that
      # detection and entry-building survive a Linux path layout.
      - name: Installer dry run
        run: |
          python scripts/install.py --list
          python scripts/install.py --print -c all | tail -20

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Locate Chrome
        run: |
          for p in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$p" >/dev/null 2>&1; then echo "JEVMCP_CHROME=$(command -v $p)" >> "$GITHUB_ENV"; break; fi
          done
          echo "using JEVMCP_CHROME=${JEVMCP_CHROME:-<auto>}"

      - name: End-to-end smoke (real browser)
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          python -u scripts/smoke.py 2>&1 | tee smoke.log

      - name: MCP stdio protocol check
        id: mcpcheck
        continue-on-error: true
        run: |
          set -o pipefail
          python -u scripts/mcp_check.py 2>&1 | tee mcp.log

      # Loads chrome-extension/ into the browser and compares its table with the server's. Unit
      # tests can prove the port matches Python; only this can prove the manifest loads and that the
      # popup reads a real page. Exits 0 with a "skipped" line if the browser has no
      # Extensions.loadUnpacked, so an older Chromium does not fail the build.
      - name: Extension check (real browser)
        id: extcheck
        continue-on-error: true
        run: |
          set -o pipefail
          python -u scripts/extension_check.py 2>&1 | tee extension.log

      # Downloading job logs needs repo admin rights; annotations and the step
      # summary do not. So a failing run here is diagnosable from an API call.
      #
      # The step summary alone is not: it is rendered in the browser and no API returns it, so a
      # reader without a token can see that this job failed and nothing about why. The four checks
      # above run with `continue-on-error`, so the job's step list reports all of them as passing --
      # `conclusion` is success for a step that failed but was allowed to. What follows therefore
      # announces, through the one channel the Checks API does expose, which of the four actually
      # failed and what each log ends with.
      #
      # That gap is not theoretical: a run went red with no `[FAIL]` line, no `Traceback` and no
      # `failed` in pytest.log, and there was no way to ask which check it was.
      - name: Publish failure detail
        if: steps.unit.outcome != 'success' || steps.smoke.outcome != 'success' || steps.mcpcheck.outcome != 'success' || steps.extcheck.outcome != 'success'
        run: |
          echo "unit=${{ steps.unit.outcome }} smoke=${{ steps.smoke.outcome }} mcp=${{ steps.mcpcheck.outcome }} ext=${{ steps.extcheck.outcome }}"
          echo "::error title=which check failed::unit=${{ steps.unit.outcome }} smoke=${{ steps.smoke.outcome }} mcp=${{ steps.mcpcheck.outcome }} ext=${{ steps.extcheck.outcome }}"

          for f in pytest.log smoke.log mcp.log extension.log; do
            [ -f "$f" ] || continue
            {
              echo "### $f"
              echo '```'
              tail -c 6000 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # The same tail again, as the only form of it an API client can read. A workflow command
            # needs its newlines escaped as %0A, which is all the python below is doing. It is one
            # line because a heredoc body would have to sit at column zero, which ends the YAML block
            # scalar this run step is written as. An empty log says so rather than sending an
            # annotation with no message, which is dropped: "this step wrote nothing" is itself the
            # finding, and it is the shape a killed process leaves behind.
            LOG="$f" python -c "import os,pathlib;b=pathlib.Path(os.environ['LOG']).read_text(errors='replace')[-5000:] or '(this log is empty -- the step wrote nothing)';print('::error title=tail of %s::%s' % (os.environ['LOG'], b.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')))"
          done

          grep -h -F '[FAIL]' smoke.log mcp.log extension.log 2>/dev/null | head -25 | while IFS= read -r line; do
            echo "::error title=failing check::$(printf '%s' "$line" | sed 's/^ *//' | cut -c1-1800)"
          done
          if grep -q -F 'Traceback' pytest.log smoke.log mcp.log extension.log 2>/dev/null; then
            echo "::error title=script crashed::$(grep -h -A12 -F 'Traceback' pytest.log smoke.log mcp.log extension.log | tr '\n' '|' | cut -c1-1800)"
          fi
          # `pytest -q` says "1 failed" for a failing test and "1 error" for a collection or fixture
          # problem. This branch used to look for `scenario failed` -- a string that only ever appears
          # in smoke.py's output -- so it could not fire, and a pytest failure that was not a plain
          # `[FAIL]` reached the summary with nothing to explain it. Now it reports pytest's own line.
          if grep -q -E '(passed|failed|error)' pytest.log 2>/dev/null; then
            echo "::error title=pytest summary::$(grep -E '[0-9]+ (passed|failed|error)' pytest.log | tail -3 | tr '\n' '|' | cut -c1-1800)"
          fi
          exit 1
