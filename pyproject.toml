[project]
name = "jev-ultrafast-mcp"
version = "0.1.5"
description = "MCP server that lets an AI agent hand browser work off instead of paying a turn per click: a decision model drives the loop server-side over ref-based element tables, with code-checked assertions and zero-model macro replay."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "mcp",
  "model-context-protocol",
  "mcp-server",
  "browser-automation",
  "ai-agents",
  "agent-tools",
  "chrome-devtools-protocol",
  "headless-chrome",
  "llm",
  "claude",
  "cursor",
  "web-automation",
  "browser-use",
  "no-playwright",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.2",
  "websockets>=12",
  "httpx[http2]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jiawei686/jev-ultrafast-mcp"
Repository = "https://github.com/jiawei686/jev-ultrafast-mcp"
Issues = "https://github.com/jiawei686/jev-ultrafast-mcp/issues"
Changelog = "https://github.com/jiawei686/jev-ultrafast-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/jiawei686/jev-ultrafast-mcp/blob/main/docs/DESIGN.md"
PyPI = "https://pypi.org/project/jev-ultrafast-mcp/"

[project.scripts]
jev-ultrafast-mcp = "jev_ultrafast_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_ultrafast_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"jev_ultrafast_mcp/js/observer.js" = "jev_ultrafast_mcp/js/observer.js"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow -- ruff is here to be a guardrail, not a style opinion -- but it has to cover
# what the code already claims. Every `# noqa:` in this repo must name a rule that is actually on:
# a suppression for a rule nobody runs is a comment dressed up as a check, and the next person to
# touch that line reads it as enforcement. `RUF100` is what keeps that true. `BLE001` is the one
# exception this codebase justifies most often -- teardown must not mask a result, and a failed
# `close()` is not a finding -- so those nine sites now say why instead of catching silently.
select = ["E", "F", "I", "W", "BLE001", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
