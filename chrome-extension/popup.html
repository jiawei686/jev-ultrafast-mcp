<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Element table</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Element table</h1>
    <p id="page" class="page">Reading the active tab…</p>
  </header>

  <div class="controls">
    <button id="observe" class="primary" type="button">Observe</button>
    <button id="copy" type="button" disabled>Copy</button>
    <label class="toggle">
      <input id="text" type="checkbox">
      page text
    </label>
  </div>

  <p id="note" class="note" hidden></p>
  <pre id="table" class="table">Press Observe to read this page.</pre>

  <footer id="stats" class="stats"></footer>

  <section class="macros">
    <h2>Replay</h2>

    <div class="row">
      <select id="macro-select" aria-label="Macro to replay"></select>
      <button id="macro-run" class="primary" type="button" disabled>Run</button>
      <button id="macro-stop" type="button" disabled>Stop</button>
      <button id="macro-forget" type="button" disabled>Forget</button>
    </div>

    <div class="row">
      <input id="macro-params" type="text" spellcheck="false"
             placeholder='parameters as JSON, e.g. {"query":"shoes"}'>
    </div>

    <details id="macro-paste">
      <summary>Paste a macro recorded by the server</summary>
      <textarea id="macro-text" rows="4" spellcheck="false"
                placeholder='the JSON browser_macro action="inspect" prints'></textarea>
      <div class="row">
        <input id="macro-name" type="text" placeholder="name (optional)">
        <button id="macro-save" type="button">Save</button>
      </div>
    </details>

    <p id="macro-note" class="note" hidden></p>
    <pre id="macro-report" class="report">No macro has run here yet.</pre>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
